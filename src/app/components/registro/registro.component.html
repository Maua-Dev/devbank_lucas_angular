<div class="quadro-total">
  <div [ngClass]="isDeposit ? 'tipo-deposito' : 'tipo'">
    {{ isDeposit ? 'DEPÓSITO' : 'SAQUE' }}
  </div>
  <div class="textos">
    <div class="texto">VALOR: <br> R${{ valor }}</div>
    <div class="texto">DATA: <br> {{ data }}</div>
    <div class="texto">SALDO: <br> R${{ saldo }}</div>
  </div>
</div>
