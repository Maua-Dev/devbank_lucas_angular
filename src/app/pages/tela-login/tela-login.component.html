<div class="TelaDaConta">
  <div class="centered-container">
    <header>
      <img src="assets/img/image.webp" class="centro-imagem-login" alt="DevBank Logo" />
    </header>

    <div *ngIf="isAPIerro" class="alerta-erro">
      ERRO! Coloque uma API válida
    </div>

    <div class="janela-input">
      <h1 class="instrucoes">Coloque o link da sua conta:</h1>
      <input
        id="validarApi"
        class="input-box"
        [(ngModel)]="apiInput"
        placeholder=""
      />
      <button class="botao-login" (click)="logar()" id="pegar">
        Logar
      </button>
    </div>
  </div>
</div>
